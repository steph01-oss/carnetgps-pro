<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>CarnetGPS Pro</title>
<link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>📍 CarnetGPS <span id="badge" class="badge">Gratuit</span></h1><div id="count"></div></header>
<main>
 <section id="tab-clients" class="tab on">
  <div id="map"></div>
  <div id="pane">
  <div class="bar"><input id="q" type="search" placeholder="Rechercher nom, adresse…"><button id="add" class="btn pri">+ Client</button></div>
  <div class="chips"><button class="chip on" data-f="all">Tous</button><button class="chip" data-f="today">Aujourd'hui</button><button class="chip" data-f="fav">★ Favoris</button><button class="chip" data-f="rep">⚠ À signaler</button></div>
  <div id="today-actions" class="hide"><button id="optim" class="btn">⚡ Optimiser la tournée</button><button id="gmroute" class="btn">🧭 Itinéraire Google</button></div>
  <div id="listwrap"><ul id="list"></ul><div id="alpha"></div></div><p id="empty" class="muted hide">Aucun client. Appuie sur « + Client » pour ajouter ta première adresse.</p>
  </div>
 </section>
 <section id="tab-team" class="tab"><div id="team"></div></section>
 <section id="tab-set" class="tab"><div id="settings"></div></section>
</main>
<nav><button data-t="clients" class="on">👥<span>Clients</span></button><button data-t="team">🤝<span>Équipe</span></button><button data-t="set">⚙️<span>Pro</span></button></nav>
<div id="modal" class="hide"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="hide"></div>
<script src="config.js"></script><script src="js/pubkey.js"></script><script src="js/license.js"></script><script src="js/geo.js"></script><script src="js/cloud.js"></script><script src="vendor/leaflet.js"></script><script src="js/app.js"></script>
</body></html>
